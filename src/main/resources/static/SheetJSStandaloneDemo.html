	<script>
		function fetchJSONAndParseErrorGetJSONFail() {

		function fetchJSONAndParseErrorProcessingFail() {
			const url = "/executive.json";
			$.getJSON(url, function(result){
				console.log( "resultString: " + JSON.stringify(result));
			})
			.then(function(resultArr) {

		async function fetchJSONAndParseAsync() {
			//const url = "https://docs.sheetjs.com/executive.json";
			//const url = "http://localhost:8080/executive.json";
			const url = "/executive.json";
			const raw_data = await (await fetch(url)).json();
			const stringifiedData = JSON.stringify(raw_data);
			console.log("JSON from URL: " + stringifiedData);
			const prez = raw_data.filter(row => row.terms.some(term => term.type === "prez"));
			prez.forEach(row => row.start = row.terms.find(term => term.type === "prez").start);
			prez.sort((l,r) => l.start.localeCompare(r.start));
			const rows = prez.map(row => ({
			name: row.name.first + " " + row.name.last,
			birthday: row.bio.birthday
			}));
			const worksheet = XLSX.utils.json_to_sheet(rows);
			const workbook = XLSX.utils.book_new();
			XLSX.utils.book_append_sheet(workbook, worksheet, "Dates");
			XLSX.utils.sheet_add_aoa(worksheet, [["Name", "Birthday"]], { origin: "A1" });
			const max_width = rows.reduce((w, r) => Math.max(w, r.name.length), 10);
			worksheet["!cols"] = [ { wch: max_width } ];
			XLSX.writeFile(workbook, "PresidentsAsync.xlsx", { compression: true });
		}
		function fetchJSONAndParse() {
			const url = "/executive.json";
			$.getJSON(url, function(result){
				console.log( "resultString: " + JSON.stringify(result));
			})
			.then(function(resultArr) {
				const prez = resultArr.filter(row => row.terms.some(term => term.type === "prez"));
				prez.forEach(row => row.start = row.terms.find(term => term.type === "prez").start);
				prez.sort((l,r) => l.start.localeCompare(r.start));
				const rows = prez.map(row => ({
					name: row.name.first + " " + row.name.last,
					birthday: row.bio.birthday
				}));
				const worksheet = XLSX.utils.json_to_sheet(rows);
				const workbook = XLSX.utils.book_new();
				XLSX.utils.book_append_sheet(workbook, worksheet, "Dates");
				XLSX.utils.sheet_add_aoa(worksheet, [["Name", "Birthday"]], { origin: "A1" });
				const max_width = rows.reduce((w, r) => Math.max(w, r.name.length), 10);
				worksheet["!cols"] = [ { wch: max_width } ];
				XLSX.writeFile(workbook, "Presidents.xlsx", { compression: true });
			})
			.catch(function(jqXHR, errorText) {
				if(jqXHR.status){
					alert( "HTTP Request failed: " + errorText );
					console.log( "HTTP Request failed: " + errorText );
				}
				else {
					alert( "Processing error occurred: " + jqXHR.toString() );
					console.log( "Processing error occurred: " + jqXHR.toString() );
				}
			});
		}

				const workbook = XLSX.utils.book_new();

				//const max_width = resultArr.reduce((w, r) => Math.max(w, r.name.length), 20);

				else {
					alert( "Processing error occurred: " + jqXHR.toString() );
					console.log( "Processing error occurred: " + jqXHR.toString() );
				}
			});
		}

		function reduceFunc(total, currentValue, initialValue) {
			var res = Math.max(total, currentValue.length);
			return res;
		}
